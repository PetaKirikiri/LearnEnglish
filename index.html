<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EnglishSuccess reading practice" />
    <link rel="icon" type="image/png" href="/brand/englishsuccess-logo.png" />
    <link rel="apple-touch-icon" href="/brand/englishsuccess-logo.png" />
    <title>EnglishSuccess</title>
  </head>
  <body>
    <div id="root"><main id="startup" style="min-height:100vh;display:grid;place-content:center;gap:16px;padding:24px;text-align:center;font-family:system-ui;background:#edf4ff;color:#18395e"><strong id="startup-message">Opening EnglishSuccess…</strong><span>กำลังเปิด…</span><button id="startup-retry" hidden style="padding:16px;font-size:18px;background:#ffdf49;border:2px solid #d3aa20;border-radius:14px">Try again · ลองอีกครั้ง</button></main></div>
    <script>
      (function(){
        function failed(){var message=document.getElementById('startup-message'),retry=document.getElementById('startup-retry');if(message)message.textContent='Couldn’t open the page';if(retry)retry.hidden=false;}
        window.addEventListener('error',failed,true);
        window.addEventListener('unhandledrejection',failed);
        setTimeout(function(){var retry=document.getElementById('startup-retry');if(retry)retry.hidden=false;},12000);
        document.getElementById('startup-retry').onclick=function(){var url=new URL(location.href);url.searchParams.set('reload',String(Date.now()));location.replace(url.href);};
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
